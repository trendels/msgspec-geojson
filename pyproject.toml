[project]
name = "msgspec-geojson"
version = "0.1.0"
description = "GeoJSON types for msgspec"
readme = "README.md"
authors = [
    { name = "Stanis Trendelenburg", email = "st@trendels.name" }
]
requires-python = ">=3.13"
dependencies = [
    "msgspec>=0.20.1",
]

[project.urls]
Source = "https://github.com/trendels/msgspec-geojson"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.3",
    "pyright>=1.1.411",
    "pytest>=9.0.0",
    "ruff>=0.16.0",
]

[tool.ruff]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/**/*.py",
    "examples/**/*.py",
]

[tool.ruff.format]
preview = true

[tool.ruff.lint]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples"]
strict = ["src", "tests", "examples"]
reportUnnecessaryTypeIgnoreComment = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_also = [
    "@overload$",
    "raise NotImplementedError",
]

[tool.pytest]
testpaths = ["tests"]
verbosity_assertions = "2"
addopts = ["--import-mode=importlib"]
